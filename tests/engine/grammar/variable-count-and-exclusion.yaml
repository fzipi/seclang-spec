meta:
  name: variable-count-and-exclusion
  description: "& counts a collection; ! removes a member from the list"
spec: 02-grammar.md#variable-list
rules: |
  SecRuleEngine On
  SecRule &ARGS_GET "@eq 2" "id:3002,phase:1,pass"
  SecRule ARGS_GET|!ARGS_GET:skip "@streq x" "id:3003,phase:1,deny,status:403"
tests:
  - test_title: count of two arguments
    stages:
      - stage:
          input:
            uri: /?a=1&b=2
          output:
            triggered_rules: [3002]
            non_triggered_rules: [3003]
            no_interruption: true
  - test_title: excluded key does not match
    stages:
      - stage:
          input:
            uri: /?skip=x
          output:
            non_triggered_rules: [3003]
            no_interruption: true
  - test_title: other key matches
    stages:
      - stage:
          input:
            uri: /?other=x
          output:
            triggered_rules: [3003]
            interruption: {rule_id: 3003, action: deny, status: 403}
