meta:
  name: multipart-two-files
  description: Two file parts are both counted and their sizes summed
spec: 09-body-processors.md#multipart
rules: |
  SecRuleEngine On
  SecRequestBodyAccess On
  SecRule &FILES "@eq 2" "id:8030,phase:2,pass"
  SecRule FILES_COMBINED_SIZE "@eq 7" "id:8031,phase:2,pass"
  SecRule &FILES_NAMES "@eq 2" "id:8032,phase:2,pass"
  SecRule FILES_NAMES "@streq g" "id:8033,phase:2,pass"
tests:
  - test_title: three-byte and four-byte files
    stages:
      - stage:
          input:
            method: POST
            uri: /
            headers: {Content-Type: "multipart/form-data; boundary=XX"}
            data: "--XX\r\nContent-Disposition: form-data; name=\"f\"; filename=\"a.txt\"\r\nContent-Type: text/plain\r\n\r\nabc\r\n--XX\r\nContent-Disposition: form-data; name=\"g\"; filename=\"b.txt\"\r\nContent-Type: text/plain\r\n\r\nwxyz\r\n--XX--\r\n"
          output: {triggered_rules: [8030, 8031, 8032, 8033], no_interruption: true}
