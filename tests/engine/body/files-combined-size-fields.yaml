meta:
  name: files-combined-size-fields
  description: FILES_COMBINED_SIZE counts uploaded file bytes only, not form fields
spec: 05-variables.md#files_combined_size
rules: |
  SecRuleEngine On
  SecRequestBodyAccess On
  SecRule FILES_COMBINED_SIZE "@eq 3" "id:8034,phase:2,pass"
  SecRule ARGS_POST:t "@streq hello" "id:8035,phase:2,pass"
tests:
  - test_title: a five-byte field and a three-byte file
    stages:
      - stage:
          input:
            method: POST
            uri: /
            headers:
              Content-Type: multipart/form-data; boundary=XX
            data: "--XX\r\nContent-Disposition: form-data; name=\"t\"\r\n\r\nhello\r\n--XX\r\nContent-Disposition: form-data; name=\"f\"; filename=\"a.txt\"\r\nContent-Type: text/plain\r\n\r\nabc\r\n--XX--\r\n"
          output:
            triggered_rules: [8034, 8035]
            no_interruption: true
