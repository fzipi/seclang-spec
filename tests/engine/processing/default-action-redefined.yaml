meta:
  name: default-action-redefined
  description: A second SecDefaultAction for the same phase in one context is a configuration error (ADR-0014)
spec: 03-processing-model.md#default-actions
rules: |
  SecRuleEngine On
  SecDefaultAction "phase:1,log,deny,status:418"
  SecRule ARGS_GET:a "@streq 1" "id:4023,phase:1"
  SecDefaultAction "phase:1,log,pass"
  SecRule ARGS_GET:b "@streq 1" "id:4024,phase:1"
tests:
  - test_title: fails to load
    stages:
      - stage:
          input:
            uri: /
          output:
            expect_error: true
