meta:
  name: default-action-no-disruptive
  description: SecDefaultAction without a disruptive action is a configuration error (ADR-0014)
spec: 03-processing-model.md#default-actions
rules: |
  SecRuleEngine On
  SecDefaultAction "phase:1,log"
tests:
  - test_title: fails to load
    stages:
      - stage:
          input:
            uri: /
          output:
            expect_error: true
