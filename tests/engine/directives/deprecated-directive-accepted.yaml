meta:
  name: deprecated-directive-accepted
  description: A Deprecated directive is accepted and ignored (ADR-0005)
spec: 04-directives.md#secguardianlog
rules: |
  SecRuleEngine On
  SecGuardianLog /dev/null
  SecRule ARGS_GET:a "@streq 1" "id:5300,phase:1,deny,status:403"
tests:
  - test_title: configuration loads and the rule fires
    stages:
      - stage:
          input:
            uri: /?a=1
          output:
            triggered_rules: [5300]
            interruption: {rule_id: 5300, action: deny, status: 403}
