meta:
  name: secresponsebodylimit-processpartial
  description: A response above SecResponseBodyLimit with ProcessPartial sets OUTBOUND_DATA_ERROR
spec: 04-directives.md#secresponsebodylimit
rules: |
  SecRuleEngine On
  SecResponseBodyAccess On
  SecResponseBodyMimeType text/plain
  SecResponseBodyLimit 5
  SecResponseBodyLimitAction ProcessPartial
  SecRule OUTBOUND_DATA_ERROR "@eq 1" "id:5111,phase:4,pass"
tests:
  - test_title: oversize response sets the error flag
    stages:
      - stage:
          input:
            uri: /
          response:
            status: 200
            headers:
              Content-Type: text/plain
            data: 0123456789
          output:
            triggered_rules: [5111]
            no_interruption: true
