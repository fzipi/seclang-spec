name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python -m unittest discover -s tools -t .
      - run: uv run python tools/validate.py
  coraza-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/coraza
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/coraza/go.mod
      - run: go test ./...
