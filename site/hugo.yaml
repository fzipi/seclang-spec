baseURL: https://seclang.org/
title: SecLang Specification
enableRobotsTXT: true
# Every page and section uses Hextra's docs layout, whose sidebar stays visible on
# desktop; the default single layout hides it below 1280px.
cascade:
  - type: docs
    target:
      kind: '{page,section}'
module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    - source: static        # explicit mounts replace the defaults; CNAME lives here
      target: static
    - source: i18n          # footer copyright string
      target: i18n
    - source: assets        # custom.css lives here
      target: assets
    - source: ../spec
      target: assets/src/spec
    - source: ../compat
      target: assets/src/compat
    - source: ../adr
      target: assets/src/adr
    - source: ../formal
      target: assets/src/formal
      includeFiles: "/*.md"
    - source: ../tests
      target: assets/src/tests
      includeFiles: "/README.md"
    - source: ../adapters
      target: assets/src/adapters
      includeFiles: "/**/README.md"
markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      link:
        useEmbedded: fallback
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    noClasses: false
menu:
  main:
    - name: Specification
      pageRef: /spec
      weight: 1
    - name: Compatibility
      pageRef: /compat
      weight: 2
    - name: Tests
      pageRef: /tests
      weight: 3
    - name: Formal model
      pageRef: /formal
      weight: 4
    - name: Decisions
      pageRef: /adr
      weight: 5
    - name: GitHub
      url: https://github.com/fzipi/seclang-spec
      weight: 6
      params:
        icon: github
params:
  author:
    name: fzipi
    link: https://github.com/fzipi
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      width: 28
      height: 28
  theme:
    default: system
    displayToggle: true
  editURL:
    enable: false
  page:
    width: wide
  footer:
    displayCopyright: true
    displayPoweredBy: false
